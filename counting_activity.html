<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Corner with Benny! | LearnFun</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .counting-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .number-card {
            background: #ffffff;
            border: 3px solid #4CAF50;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .number-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .number {
            font-size: 3em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
        }
        
        .dots-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
        }
        
        .dot {
            width: 15px;
            height: 15px;
            background-color: #4CAF50;
            border-radius: 50%;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .back-button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header>
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="images/benny_bunny_head.png" alt="Benny Bunny Icon" class="logo-bunny-head">
                    <h1>LearnFun</h1>
                </div>
            </a>
            <a href="#" class="parents-link">For Parents</a>
        </header>

        <main>
            <div class="subject-header">
                <img src="images/benny_bunny_wave.png" alt="Benny the Bunny Waving" class="subject-mascot">
                <div class="subject-title">
                    <h2>Counting Corner!</h2>
                    <p>Click on the numbers to hear them and see how many dots they represent!</p>
                </div>
            </div>

            <div class="counting-container" id="countingContainer">
                <!-- Numbers will be generated by JavaScript -->
            </div>

            <a href="math.html" class="back-button">Back to Math Adventures</a>
        </main>

        <footer>
            <p>© 2023 Your LearnFun Site</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const countingContainer = document.getElementById('countingContainer');
            
            // Create number cards from 1 to 10
            for (let i = 1; i <= 10; i++) {
                const card = document.createElement('div');
                card.className = 'number-card';
                
                const numberElement = document.createElement('div');
                numberElement.className = 'number';
                numberElement.textContent = i;
                
                const dotsContainer = document.createElement('div');
                dotsContainer.className = 'dots-container';
                
                // Add dots representing the number
                for (let j = 0; j < i; j++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dotsContainer.appendChild(dot);
                }
                
                card.appendChild(numberElement);
                card.appendChild(dotsContainer);
                
                // Add click event
                card.addEventListener('click', () => {
                    // Try to play number sound
                    try {
                        const sound = new Audio(`sounds/numbers/${i}.mp3`);
                        sound.play().catch(e => console.warn(`Could not play sound for number ${i}`, e));
                    } catch (e) {
                        console.warn(`Sound file for number ${i} not found.`);
                    }
                    
                    // Highlight the card
                    card.style.backgroundColor = '#E8F5E9';
                    setTimeout(() => {
                        card.style.backgroundColor = '#ffffff';
                    }, 500);
                });
                
                countingContainer.appendChild(card);
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
