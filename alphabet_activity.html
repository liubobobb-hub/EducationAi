<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Fun with Benny! | LearnFun</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .alphabet-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        .letter-card {
            background: #ffffff;
            border: 3px solid #FFC107;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .letter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .letter {
            font-size: 2.5em;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }
        
        .example {
            font-size: 1em;
            color: #333;
        }
        
        .example-image {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-top: 10px;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #FFC107;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .back-button:hover {
            background-color: #FFB300;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header>
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="images/benny_bunny_head.png" alt="Benny Bunny Icon" class="logo-bunny-head">
                    <h1>LearnFun</h1>
                </div>
            </a>
            <a href="#" class="parents-link">For Parents</a>
        </header>

        <main>
            <div class="subject-header">
                <img src="images/benny_bunny_wave.png" alt="Benny the Bunny Waving" class="subject-mascot">
                <div class="subject-title">
                    <h2>Alphabet Fun!</h2>
                    <p>Click on any letter to hear its sound and see an example!</p>
                </div>
            </div>

            <div class="alphabet-container" id="alphabetContainer">
                <!-- Letters will be generated by JavaScript -->
            </div>

            <a href="english.html" class="back-button">Back to English</a>
        </main>

        <footer>
            <p>© 2023 Your LearnFun Site</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const alphabetContainer = document.getElementById('alphabetContainer');
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const examples = {
                'A': 'Apple', 'B': 'Ball', 'C': 'Cat', 'D': 'Dog', 
                'E': 'Elephant', 'F': 'Fish', 'G': 'Giraffe', 'H': 'House',
                'I': 'Ice cream', 'J': 'Jellyfish', 'K': 'Kite', 'L': 'Lion',
                'M': 'Monkey', 'N': 'Nest', 'O': 'Orange', 'P': 'Penguin',
                'Q': 'Queen', 'R': 'Rabbit', 'S': 'Sun', 'T': 'Tree',
                'U': 'Umbrella', 'V': 'Violin', 'W': 'Watermelon', 'X': 'X-ray',
                'Y': 'Yacht', 'Z': 'Zebra'
            };
            
            // Create letter cards
            letters.split('').forEach(letter => {
                const card = document.createElement('div');
                card.className = 'letter-card';
                
                const letterElement = document.createElement('div');
                letterElement.className = 'letter';
                letterElement.textContent = letter;
                
                const exampleElement = document.createElement('div');
                exampleElement.className = 'example';
                exampleElement.textContent = examples[letter];
                
                card.appendChild(letterElement);
                card.appendChild(exampleElement);
                
                // Add click event
                card.addEventListener('click', () => {
                    // Play letter sound
                    try {
                        const sound = new Audio(`sounds/alphabet/${letter.toLowerCase()}.mp3`);
                        sound.play().catch(e => console.warn(`Could not play sound for letter ${letter}`, e));
                    } catch (e) {
                        console.warn(`Sound file for letter ${letter} not found.`);
                    }
                    
                    // Highlight the card
                    card.style.backgroundColor = '#FFF9C4';
                    setTimeout(() => {
                        card.style.backgroundColor = '#ffffff';
                    }, 500);
                });
                
                alphabetContainer.appendChild(card);
            });
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
