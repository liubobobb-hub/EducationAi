<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFun with Benny!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header>
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="images/benny_bunny_head.png" alt="Benny Bunny Icon" class="logo-bunny-head"> <!-- Small bunny head for logo -->
                    <h1>LearnFun</h1>
                </div>
            </a>
            <div class="header-right">
                <div class="language-selector">
                    <select id="languageSelect" class="language-dropdown">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                    <div class="select-arrow"></div>
                </div>
                <a href="user-profile.html" class="profile-link">
                    <img src="images/benny_bunny_head.png" alt="Profile" class="profile-icon">
                    <span>我的档案</span>
                </a>
                <a href="#" class="parents-link">For Parents</a>
            </div>
        </header>

        <main>
            <div class="mascot-area">
                <img src="images/benny_bunny_wave.png" alt="Benny the Bunny Waving" id="bennyMascot">
                <div class="speech-bubble" id="speechBubble">
                    Hi! I'm Benny the Bunny! Ready to learn?
                </div>
            </div>

            <nav class="navigation-buttons">
                <a href="english.html" class="nav-button english-button" id="englishButton">
                    <img src="images/apple_icon.png" alt="Apple Icon" class="button-icon">
                    <span>English</span>
                </a>
                <a href="math.html" class="nav-button math-button" id="mathButton">
                    <img src="images/numbers_icon.png" alt="Numbers Icon" class="button-icon">
                    <span>Math</span>
                </a>
                <a href="poetry.html" class="nav-button poetry-button" id="poetryButton">
                    <img src="images/icon_placeholder_book.png" alt="Poetry Icon" class="button-icon">
                    <span>古诗词</span>
                </a>
                <a href="programming.html" class="nav-button programming-button" id="programmingButton">
                    <img src="images/code_icon.png" alt="Code Icon" class="button-icon">
                    <span>Programming</span>
                </a>
            </nav>
        </main>

        <footer>
            <p>© 2023 Your LearnFun Site</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
