<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Games with Benny! | LearnFun</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .word-games-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }
        
        .word-game {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .game-title {
            font-size: 1.5em;
            color: #007bff;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .word-card {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            background: #f8f9fa;
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        
        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }
        
        .option-button {
            padding: 10px;
            font-size: 1.2em;
            background: #FFC107;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        
        .option-button:hover {
            background: #FFB300;
            transform: translateY(-3px);
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #FFC107;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .back-button:hover {
            background-color: #FFB300;
        }
        
        .score {
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        
        .feedback {
            font-size: 1.2em;
            height: 30px;
            margin: 10px 0;
            font-weight: bold;
        }
        
        .correct {
            color: #4CAF50;
        }
        
        .incorrect {
            color: #F44336;
        }
        
        .next-button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1em;
            display: none;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header>
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="images/benny_bunny_head.png" alt="Benny Bunny Icon" class="logo-bunny-head">
                    <h1>LearnFun</h1>
                </div>
            </a>
            <a href="#" class="parents-link">For Parents</a>
        </header>

        <main>
            <div class="subject-header">
                <img src="images/benny_bunny_wave.png" alt="Benny the Bunny Waving" class="subject-mascot">
                <div class="subject-title">
                    <h2>Word Games!</h2>
                    <p>Learn new words and test your vocabulary with Benny!</p>
                </div>
            </div>

            <div class="word-games-container">
                <div class="word-game">
                    <div class="game-title">Choose the Correct Meaning</div>
                    <div class="score">Score: <span id="scoreValue">0</span></div>
                    <div class="game-area">
                        <div class="word-card" id="currentWord">Happy</div>
                        <div class="feedback" id="feedback"></div>
                        <div class="options-container" id="optionsContainer">
                            <!-- Options will be generated by JavaScript -->
                        </div>
                        <button class="next-button" id="nextButton">Next Word</button>
                    </div>
                </div>
                <a href="english.html" class="back-button">Back to English</a>
            </div>
        </main>

        <footer>
            <p>© 2023 Your LearnFun Site</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Word list with meanings
            const words = [
                { word: 'Happy', correct: 'Feeling joy', options: ['Feeling joy', 'Feeling sad', 'Very angry', 'Tired'] },
                { word: 'Big', correct: 'Large in size', options: ['Large in size', 'Very small', 'Round shape', 'Very thin'] },
                { word: 'Fast', correct: 'Moving quickly', options: ['Moving quickly', 'Very slow', 'Standing still', 'Heavy weight'] },
                { word: 'Cold', correct: 'Low temperature', options: ['Low temperature', 'Very hot', 'Warm feeling', 'Bright color'] },
                { word: 'Loud', correct: 'Strong sound', options: ['Strong sound', 'Very quiet', 'No noise', 'Soft voice'] },
                { word: 'Soft', correct: 'Pleasant to touch', options: ['Pleasant to touch', 'Very hard', 'Rough texture', 'Sharp edge'] },
                { word: 'Dark', correct: 'Little or no light', options: ['Little or no light', 'Very bright', 'Colorful', 'Transparent'] },
                { word: 'Strong', correct: 'Great power', options: ['Great power', 'Very weak', 'Easily broken', 'Light weight'] }
            ];
            
            const currentWord = document.getElementById('currentWord');
            const optionsContainer = document.getElementById('optionsContainer');
            const feedback = document.getElementById('feedback');
            const scoreValue = document.getElementById('scoreValue');
            const nextButton = document.getElementById('nextButton');
            
            let currentWordIndex = 0;
            let score = 0;
            
            // Function to load a word
            function loadWord(index) {
                const wordData = words[index];
                currentWord.textContent = wordData.word;
                feedback.textContent = '';
                feedback.className = 'feedback';
                
                // Clear previous options
                optionsContainer.innerHTML = '';
                
                // Shuffle options
                const shuffledOptions = [...wordData.options].sort(() => Math.random() - 0.5);
                
                // Create option buttons
                shuffledOptions.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'option-button';
                    button.textContent = option;
                    
                    button.addEventListener('click', () => {
                        // Check answer
                        if (option === wordData.correct) {
                            feedback.textContent = 'Correct! 🎉';
                            feedback.className = 'feedback correct';
                            score++;
                            scoreValue.textContent = score;
                            
                            // Try to play sound
                            try {
                                const sound = new Audio('sounds/correct.mp3');
                                sound.play().catch(e => console.warn('Could not play sound', e));
                            } catch (e) {
                                console.warn('Sound file not found.');
                            }
                        } else {
                            feedback.textContent = 'Try again! 🤔';
                            feedback.className = 'feedback incorrect';
                            
                            // Try to play sound
                            try {
                                const sound = new Audio('sounds/incorrect.mp3');
                                sound.play().catch(e => console.warn('Could not play sound', e));
                            } catch (e) {
                                console.warn('Sound file not found.');
                            }
                        }
                        
                        // Disable all options after selection
                        document.querySelectorAll('.option-button').forEach(btn => {
                            btn.disabled = true;
                            if (btn.textContent === wordData.correct) {
                                btn.style.backgroundColor = '#4CAF50'; // Highlight correct answer
                            }
                        });
                        
                        // Show next button if there are more words
                        if (currentWordIndex < words.length - 1) {
                            nextButton.style.display = 'block';
                        } else {
                            // Game over
                            setTimeout(() => {
                                feedback.textContent = `Game Over! Your score: ${score}/${words.length}`;
                                nextButton.textContent = 'Play Again';
                                nextButton.style.display = 'block';
                            }, 1000);
                        }
                    });
                    
                    optionsContainer.appendChild(button);
                });
                
                // Hide next button
                nextButton.style.display = 'none';
            }
            
            // Load first word
            loadWord(currentWordIndex);
            
            // Next button click
            nextButton.addEventListener('click', () => {
                // Check if game is over
                if (currentWordIndex === words.length - 1) {
                    // Reset game
                    currentWordIndex = 0;
                    score = 0;
                    scoreValue.textContent = score;
                } else {
                    // Load next word
                    currentWordIndex++;
                }
                loadWord(currentWordIndex);
            });
            
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
