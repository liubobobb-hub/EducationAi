<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFun English with Benny!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header>
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="images/benny_bunny_head.png" alt="Benny Bunny Icon" class="logo-bunny-head">
                    <h1>LearnFun</h1>
                </div>
            </a>
            <div class="header-right">
                <div class="language-selector">
                    <select id="languageSelect" class="language-dropdown">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                    <div class="select-arrow"></div>
                </div>
                <a href="#" class="parents-link">For Parents</a>
            </div>
        </header>

        <main>
            <div class="subject-header">
                <img src="images/benny_bunny_wave.png" alt="Benny the Bunny Waving" class="subject-mascot">
                <div class="subject-title">
                    <h2>English Time!</h2>
                    <p>Let's learn letters, words, and read fun stories with Benny!</p>
                </div>
            </div>

            <nav class="activity-grid">
                <a href="alphabet_activity.html" class="activity-card english-theme">
                    <img src="images/apple_icon.png" alt="Alphabet Icon" class="activity-icon">
                    <span>Alphabet Fun</span>
                    <p class="activity-description">Learn your ABCs!</p>
                </a>
                <a href="words_activity.html" class="activity-card english-theme">
                    <!-- You might want a specific icon for words, e.g., a book or speech bubble -->
                    <img src="images/icon_placeholder_book.png" alt="Word Games Icon" class="activity-icon">
                    <span>Word Games</span>
                    <p class="activity-description">Discover new words!</p>
                </a>
                <a href="stories_activity.html" class="activity-card english-theme">
                    <!-- Icon for stories, e.g., an open storybook or stars -->
                    <img src="images/icon_placeholder_storybook.png" alt="Story Time Icon" class="activity-icon">
                    <span>Story Time</span>
                    <p class="activity-description">Listen to exciting stories!</p>
                </a>
                 <a href="phonics_activity.html" class="activity-card english-theme">
                    <img src="images/icon_placeholder_sound.png" alt="Phonics Icon" class="activity-icon">
                    <span>Phonics Play</span>
                    <p class="activity-description">Sound out letters!</p>
                </a>
            </nav>
        </main>

        <footer>
            <p>© 2023 Your LearnFun Site</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
