<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFun Programming with Benny!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header>
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="images/benny_bunny_head.png" alt="Benny Bunny Icon" class="logo-bunny-head">
                    <h1>LearnFun</h1>
                </div>
            </a>
            <a href="#" class="parents-link">For Parents</a>
        </header>

        <main>
            <div class="subject-header">
                <img src="images/benny_bunny_wave.png" alt="Benny the Bunny Waving" class="subject-mascot">
                <div class="subject-title">
                    <h2>Programming Fun!</h2>
                    <p>Let's learn coding concepts and create amazing things with Benny!</p>
                </div>
            </div>

            <nav class="activity-grid">
                <a href="blocks_activity.html" class="activity-card programming-theme">
                    <img src="images/code_icon.png" alt="Block Coding Icon" class="activity-icon">
                    <span>Block Coding</span>
                    <p class="activity-description">Drag and drop to code!</p>
                </a>
                <a href="logic_activity.html" class="activity-card programming-theme">
                    <img src="images/icon_placeholder_puzzles.png" alt="Logic Puzzles Icon" class="activity-icon">
                    <span>Logic Puzzles</span>
                    <p class="activity-description">Solve fun coding challenges!</p>
                </a>
                <a href="robot_activity.html" class="activity-card programming-theme">
                    <img src="images/icon_placeholder_robot.png" alt="Robot Programming Icon" class="activity-icon">
                    <span>Robot Friends</span>
                    <p class="activity-description">Program your robot buddy!</p>
                </a>
                <a href="games_activity.html" class="activity-card programming-theme">
                    <img src="images/icon_placeholder_game.png" alt="Game Creation Icon" class="activity-icon">
                    <span>Game Maker</span>
                    <p class="activity-description">Create your own games!</p>
                </a>
            </nav>
        </main>

        <footer>
            <p>© 2023 Your LearnFun Site</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
