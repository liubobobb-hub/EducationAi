<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFun 古诗词 with Benny!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header>
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="images/benny_bunny_head.png" alt="Benny Bunny Icon" class="logo-bunny-head">
                    <h1>LearnFun</h1>
                </div>
            </a>
            <div class="header-right">
                <div class="language-selector">
                    <select id="languageSelect" class="language-dropdown">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                    <div class="select-arrow"></div>
                </div>
                <a href="user-profile.html" class="profile-link">
                    <img src="images/benny_bunny_head.png" alt="Profile" class="profile-icon">
                    <span>我的档案</span>
                </a>
                <a href="#" class="parents-link">For Parents</a>
            </div>
        </header>

        <main>
            <div class="subject-header">
                <img src="images/benny_bunny_wave.png" alt="Benny the Bunny Waving" class="subject-mascot">
                <div class="subject-title">
                    <h2>古诗词时光！</h2>
                    <p>和小兔子本尼一起学习优美的古诗词，感受中华文化的魅力！</p>
                </div>
            </div>

            <nav class="activity-grid">
                <a href="tang_poems_activity.html" class="activity-card poetry-theme">
                    <img src="images/icon_placeholder_book.png" alt="Tang Poems Icon" class="activity-icon">
                    <span>唐诗三百首</span>
                    <p class="activity-description">学习经典唐诗名篇</p>
                </a>
                <a href="song_ci_activity.html" class="activity-card poetry-theme">
                    <img src="images/icon_placeholder_storybook.png" alt="Song Ci Icon" class="activity-icon">
                    <span>宋词欣赏</span>
                    <p class="activity-description">品味优美的宋词</p>
                </a>
                <a href="children_poems_activity.html" class="activity-card poetry-theme">
                    <img src="images/apple_icon.png" alt="Children Poems Icon" class="activity-icon">
                    <span>儿童诗歌</span>
                    <p class="activity-description">专为儿童创作的诗歌</p>
                </a>
                <a href="poetry_games_activity.html" class="activity-card poetry-theme">
                    <img src="images/icon_placeholder_game.png" alt="Poetry Games Icon" class="activity-icon">
                    <span>诗词游戏</span>
                    <p class="activity-description">通过游戏学诗词</p>
                </a>
            </nav>
        </main>

        <footer>
            <p>© 2023 Your LearnFun Site</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
